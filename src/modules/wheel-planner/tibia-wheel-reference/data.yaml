revelation:
  - name: Gift of Life
    template: "If an attack (except with agony damage) were to kill you but the overkill damage amounts to less than %1 of your maximum hit points, you will heal yourself for %2 of your maximum hit points. Only after that is the damage applied. In addition, all your spell cooldowns are reduced by 60 seconds, and %3 of your maximum mana is restored. Cooldown: %4 The cooldown is only reduced while the character has a battle sign."
    tiers:
      - [ "20%", "20%", "20%", "30h" ]
      - [ "25%", "25%", "25%", "20h" ]
      - [ "30%", "30%", "30%", "10h" ]
  - name: Executioner's Throw
    template: "This spell throws your weapon on your target and jumps on %1 nearby enemies. Deals %2 additional damage to targets with less than 30% of their hit points. Cooldown: %3 seconds"
    tiers:
      - [ 2, "100%", 18 ]
      - [ 3, "125%", 14 ]
      - [ 4, "150%", 10 ]
  - name: Combat Mastery
    template: "Take less damage the lower your life is (1% reduced damage taken per %1 missing hp). This bonus is doubled while wielding a shield. Deal more damage the lower your targets life is (1% increased damage per %2 missing hp). This bonus is doubled while wielding a two-handed weapon."
    tiers:
      - [ "14%", "14%" ]
      - [ "12%", "12%" ]
      - [ "10%", "10%" ]
  - name: Avatar of Steel
    template: "This spell transforms yourself into a powerful avatar for 15 seconds. While in this form, you benefit from %1 damage reduction and all your attacks are critical hits with %2 critical extra damage. Cooldown: %3 minutes"
    tiers:
      - [ "5%", "5%", 120 ]
      - [ "10%", "10%", 90 ]
      - [ "15%", "15%", 60 ]
  - name: Divine Grenade
    template: "This spell plants a marker at the feet of your target that explodes after 3 seconds, dealing holy damage. +16% base damage per additional stage. Cooldown: %1 seconds"
    tiers:
      - [ 26 ]
      - [ 20 ]
      - [ 14 ]
  - name: Divine Empowerment
    template: "This support spell creates a field of holy energy around your feet for 5 seconds. As long as you stand in this field, your dealt damage increases by %1. Cooldown: %2 seconds"
    tiers:
      - [ "8%", 32 ]
      - [ "10%", 28 ]
      - [ "12%", 24 ]
  - name: Avatar of Light
    template: "This spell transforms yourself into a powerful avatar for 15 seconds. While in this form, you benefit from %1 damage reduction and all your attacks are critical hits with %2 critical extra damage. Cooldown: %3 minutes"
    tiers:
      - [ "5%", "5%", 120 ]
      - [ "10%", "10%", 90 ]
      - [ "15%", "15%", 60 ]
  - name: Beam Mastery
    template: "Your beams now also hit tiles adjacent to the main beam, dealing %1 of the initial damage. In addition, for each target hit by a beam spell, the cooldown of all other spells is reduced by 1 sec (up to a maximum of 3 sec) and the damage of beam spells is increased by %2 (up to a maximum of %3)."
    tiers:
      - [ "25%", "10%", "30%" ]
      - [ "40%", "12%", "36%" ]
      - [ "70%", "14%", "42%" ]
  - name: Lord of Destruction
    template: "Grants %1 more fire damage for Mastery of Flames, %2 more critical hit chance for Mastery of Thunder and %3 more critical damage for Mastery of Decay."
    tiers:
      - [ "2.00%", "2.00%", "15.00%" ]
      - [ "3.00%", "3.00%", "25.50%" ]
      - [ "4.00%", "4.00%", "30.00%" ]
  - name: Avatar of Storm
    template: "This spell transforms yourself into a powerful avatar for 15 seconds. While in this form, you benefit from %1 damage reduction and all your attacks are critical hits with %2 critical extra damage. Cooldown: %3 minutes"
    tiers:
      - [ "5%", "5%", 120 ]
      - [ "10%", "10%", 90 ]
      - [ "15%", "15%", 60 ]
  - name: Twin Bursts
    template: "Decide wisely whether you want to cast ice or earth damage in a small area around you, as these two ring spells share the same cooldown. Both spells deal %1 additional damage to targets with more than 60% of their hit points. Cooldown: %2 seconds"
    tiers:
      - [ "20%", 22 ]
      - [ "40%", 18 ]
      - [ "60%", 14 ]
  - name: Blessing of the Grove
    template: "Your healing spells can achieve critical hits. Additionally, your healing is increased by %1 against targets below 60% hit points. This effect is doubled against targets below 30% hit points.."
    tiers:
      - [ "5%" ]
      - [ "7.5%" ]
      - [ "10%" ]
  - name: Avatar of Nature
    template: "This spell transforms yourself into a powerful avatar for 15 seconds. While in this form, you benefit from %1 damage reduction and all your attacks are critical hits with %2 critical extra damage. Cooldown: %3 minutes"
    tiers:
      - [ "5%", "5%", 120 ]
      - [ "10%", "10%", 90 ]
      - [ "15%", "15%", 60 ]
  - name: Spiritual Outburst
    template: "This spell consumes your Harmony. Releases a massive attack chaining to 7 additional enemies. When used with full Harmony, repeats after 1 second for %1 of its original damage. Cooldown: %2 seconds."
    tiers:
      - [ "37.5%", 24 ]
      - [ "50%", 20 ]
      - [ "62.5%", 16 ]
  - name: Ascetic
    template: "Increases the Harmony base bonus by %1 and your autoattacks deal additional damage equal to %2 of your mantra."
